<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F13"><title>Moy servisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#ECEEF1;--bg:#0D0F13;--card:#171B21;--mute:#8B93A0;--oil:#E8A94A;--line:#262C35;--btn:#E8A94A;--btnt:#171208;--danger:#E2574C}
@media(prefers-color-scheme:light){:root{--ink:#1B1F26;--bg:#F3F1EC;--card:#fff;--mute:#6B7280;--oil:#B5680C;--line:#E1DEDA;--btn:#1B1F26;--btnt:#fff;--danger:#C7392F}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Inter,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);z-index:2}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
header b{font-weight:650;font-size:1.05rem;letter-spacing:-.01em}header span{color:var(--mute);font-size:.85rem}
main{max-width:640px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card.accent{border-left:3px solid var(--oil)}
.card.danger-zone{border-color:var(--danger)}
.card.danger-zone p{color:var(--mute);margin:0 0 10px;font-size:.9rem}
h2{font-size:1rem;font-weight:650;letter-spacing:-.01em;margin:0 0 10px}
.f{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:20px;height:20px;padding:0}
.chk{display:flex;align-items:center;gap:8px}
input:focus,button:focus-visible,.btn:focus-visible{outline:2px solid var(--oil);outline-offset:1px}
button,.btn{display:inline-block;text-decoration:none;text-align:center;font:inherit;font-weight:650;padding:12px 16px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);cursor:pointer}
.sec{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.btn.danger{background:var(--danger);color:#fff}
.plate{display:inline-flex;border:2px solid #1B222C;border-radius:6px;background:#fff;color:#1B222C;font-weight:700;letter-spacing:.08em;overflow:hidden;font-size:1.05rem}
.plate i{background:#1B4FA0;color:#fff;font-size:.6rem;padding:0 6px;font-style:normal;display:flex;align-items:center}
.plate b{padding:3px 10px}
.car{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.mj{border-top:1px solid var(--line)}.mj:first-child{border-top:0}
small{display:block;color:var(--mute)}
.acts{display:flex;flex-direction:column;gap:6px}.acts .btn{padding:8px 12px}
.tr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.oil{color:var(--oil)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.grid .n{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.empty{color:var(--mute);padding:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;color:var(--mute);border-radius:0;padding:10px 2px 12px;font-size:.78rem;font-weight:500}
nav button svg{stroke:currentColor}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--oil)}
#login{max-width:340px;margin:14vh auto 0;padding:16px;text-align:center}
#login .brand{justify-content:center;margin-bottom:22px}
#login .brand b{font-size:1.15rem}
#login .card{text-align:left}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:5;max-width:90%;font-weight:500}
@media(min-width:800px){body{padding:0 0 0 190px}nav{top:0;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:64px}nav button{flex-direction:row;justify-content:flex-start;gap:10px;text-align:left;padding:12px 20px;font-size:.92rem}nav button.on{box-shadow:inset 3px 0 0 var(--oil)}}
</style></head><body>
<div id="login" hidden>
<div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2C9 7 6 10.5 6 14a6 6 0 0 0 12 0c0-3.5-3-7-6-12Z" fill="var(--oil)"/></svg><b>Moy Xizmati</b></div>
<div class="card"><h2>Tizimga kirish</h2><div class="f">
<input id="lg" placeholder="Login" autocomplete="username"><input id="parol" type="password" placeholder="Parol" autocomplete="current-password"><button id="kir">Kirish</button></div></div></div>
<div id="app" hidden>
<header><div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C9 7 6 10.5 6 14a6 6 0 0 0 12 0c0-3.5-3-7-6-12Z" fill="var(--oil)"/></svg><b id="hd">Moy servisi</b></div><span id="bg"></span><button class="sec" id="chiq" style="padding:6px 10px">Chiqish</button></header>
<main>
<section id="s-yangi" class="on"><div class="card accent"><h2>Moy almashtirildi</h2><div class="f">
<input id="f-raqam" placeholder="Mashina raqami: 90G617JA" autocapitalize="characters">
<div class="two"><input id="f-rusum" placeholder="Rusum (Nexia, Cobalt)"><input id="f-ism" placeholder="Mijoz ismi"></div>
<input id="f-tel" type="tel" placeholder="Telefon: +998 90 123 45 67">
<div class="two"><input id="f-km" type="number" inputmode="numeric" placeholder="Spidometr, km"><input id="f-sum" type="number" inputmode="numeric" placeholder="Summa, so'm"></div>
<input id="f-moy" list="moylar" placeholder="Moy turi: 5W-30"><datalist id="moylar"><option value="5W-30"><option value="5W-40"><option value="10W-40"><option value="0W-20"></datalist>
<label class="chk"><input type="checkbox" id="f-filtr"> Filtr ham almashtirildi</label>
<button id="f-saqla">Saqlash</button></div></div></section>
<section id="s-mj"><div class="card"><input id="q" placeholder="Raqam, ism yoki telefon bo'yicha qidirish"><div id="mj-list"></div></div></section>
<section id="s-esl"><div class="card"><h2>Muddati yaqin mijozlar</h2><button class="sec ega" id="sms-hammaga" style="margin-bottom:10px;width:100%">SMS yuborish (hammasiga)</button><div id="e-list"></div></div></section>
<section id="s-hs"><div id="hs"></div></section>
<section id="s-sz"><div class="card"><h2>Servis sozlamalari</h2><div class="f">
<input id="s-servis" placeholder="Servis nomi"><div class="two"><input id="s-km" type="number" placeholder="Oraliq, km"><input id="s-kun" type="number" placeholder="Oraliq, kun"></div>
<button id="s-saqla">Saqlash</button></div></div>
<div class="card"><h2>Ustalar</h2><div id="s-ustalar"></div><div class="f" style="margin-top:10px"><div class="two"><input id="u-login" placeholder="Usta logini"><input id="u-parol" type="password" placeholder="Parol (6+ belgi)"></div><button id="u-qosh" class="sec">Usta qo'shish</button></div></div></section>
</main>
<nav>
<button data-t="yangi" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Yangi</span></button>
<button data-t="mj"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><line x1="20" y1="20" x2="15" y2="15"/></svg><span>Mijozlar</span></button>
<button data-t="esl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a4 4 0 0 0-4 4V11c0 .9-.3 1.7-.9 2.4L5.5 15.5h13L16.9 13.4c-.6-.7-.9-1.5-.9-2.4V7.5a4 4 0 0 0-4-4Z"/><path d="M9.8 18.5a2.3 2.3 0 0 0 4.4 0"/></svg><span>Eslatma</span></button>
<button data-t="hs" class="ega"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="15"/></svg><span>Hisobot</span></button>
<button data-t="sz" class="ega"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12c0 .3 0 .6-.1.9l1.6 1.3-1.5 2.6-1.9-.6a6 6 0 0 1-1.6.9L15.1 19H12.9l-.4-2a6 6 0 0 1-1.6-.9l-1.9.6-1.5-2.6L9.1 13a5 5 0 0 1 0-1.8L7.5 9.9 9 7.3l1.9.6a6 6 0 0 1 1.6-.9l.4-2h2.2l.4 2c.6.2 1.1.5 1.6.9l1.9-.6 1.5 2.6L18.9 11c.1.3.1.6.1 1Z"/></svg><span>Sozlama</span></button>
</nav>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pul=n=>Number(n||0).toLocaleString('ru-RU')+" so'm";
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plate=r=>`<span class="plate"><i>UZ</i><b>${esc(r)}</b></span>`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
function show(ok){$('#login').hidden=ok;$('#app').hidden=!ok}
async function api(u,b){
  const r=await fetch('/api/'+u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
  if(r.status==401&&u!='login'){show(false);throw 0}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw (typeof j.detail=='string'?j.detail:'Ma\'lumotni to\'g\'ri kiriting');return j}
const act=async f=>{try{await f()}catch(e){if(e)toast(e)}};
const kun=(d,b)=>{const n=Math.round((new Date(d)-new Date(b))/864e5);return n<0?(-n)+" kun o'tib ketgan":n==0?"bugun":n+" kun qoldi"};
function chart(rows,label){
  if(!rows.length)return '<div class="empty">Ma\'lumot yo\'q.</div>';
  const max=Math.max(...rows.map(r=>r.tushum),1),w=Math.max(220,rows.length*36),h=110;
  const bars=rows.map((r,i)=>{const bh=Math.max(2,Math.round(r.tushum/max*84));const x=i*36+6;
    return `<rect x="${x}" y="${94-bh}" width="24" height="${bh}" rx="3" fill="var(--oil)"><title>${esc(r[label])}: ${pul(r.tushum)}</title></rect>`+
           `<text x="${x+12}" y="106" font-size="9" fill="var(--mute)" text-anchor="middle">${esc((r[label]||'').slice(label=='oy'?5:8))}</text>`}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px" preserveAspectRatio="xMinYMin meet">${bars}</svg>`}
async function yangila(){
  const h=await api('holat');show(true);
  $('#hd').textContent=h.servis;$('#bg').textContent='Bugun: '+h.bugun_soni+' ta';
  document.querySelectorAll('.ega').forEach(e=>e.hidden=h.rol!='ega');
  $('#e-list').innerHTML=h.yaqin.length?h.yaqin.map(x=>`<div class="mj"><div class="car" style="cursor:default"><div>${plate(x.raqam)}<small>${esc(x.ism)||'Ismi yozilmagan'}, ${esc(x.rusum)}</small><small>Muddat: ${x.keyingi_sana} (${kun(x.keyingi_sana,h.bugun)}), ${x.keyingi_km} km</small></div><div class="acts">${x.telefon?`<a class="btn sec" href="tel:${esc(x.telefon)}">Qo'ng'iroq</a><a class="btn sec" href="sms:${esc(x.telefon)}?body=${encodeURIComponent('Hurmatli mijoz, '+x.raqam+' mashinangizda moy almashtirish vaqti yaqinlashdi.')}">SMS</a>`:''}</div></div></div>`).join(''):'<div class="empty">Yaqin 14 kunda muddati keladigan mijoz yo\'q.</div>'}
async function qidir(){
  const l=await api('mijoz?q='+encodeURIComponent($('#q').value));
  $('#mj-list').innerHTML=l.length?l.map(m=>`<div class="mj" data-r="${esc(m.raqam)}"><div class="car"><div>${plate(m.raqam)}<small>${esc(m.ism)} ${esc(m.rusum)}</small></div><small>${m.soni} marta</small></div><div class="hist"></div></div>`).join(''):'<div class="empty">Mijoz topilmadi.</div>'}
async function hisobot(){
  const h=await api('hisobot');
  $('#hs').innerHTML=`<div class="grid"><div class="card accent"><small>Bugun</small><div class="n oil">${pul(h.bugun.tushum)}</div><small>${h.bugun.soni} ta xizmat</small></div><div class="card accent"><small>Shu oy</small><div class="n">${pul(h.oy.tushum)}</div><small>${h.oy.soni} ta xizmat</small></div></div><div class="card" style="margin-top:12px"><h2>Oxirgi 14 kun</h2>${chart(h.kunlik,'sana')}</div><div class="card" style="margin-top:12px"><h2>Oylar bo'yicha</h2>${chart(h.oylik,'oy')}</div><div class="card" style="margin-top:12px"><h2>Ustalar (shu oy)</h2>${h.ustalar.map(u=>`<div class="tr"><span>${esc(u.usta)}, ${u.soni} ta</span><b>${pul(u.tushum)}</b></div>`).join('')||'<div class="empty">Ma\'lumot yo\'q.</div>'}</div><a class="btn" style="display:block;margin-top:12px" href="/api/eksport">Excel uchun yuklab olish (CSV)</a><div class="card danger-zone" style="margin-top:12px"><h2>Tarixni tozalash</h2><p>Barcha xizmat tarixi va mijozlar ro'yxati butunlay o'chadi. Bu amalni ortga qaytarib bo'lmaydi.</p><button class="btn danger" onclick="tozala()">Hammasini tozalash</button></div>`}
async function tozala(){
  if(!confirm("Barcha xizmat tarixi va mijozlar ro'yxati o'chiriladi. Davom etasizmi?"))return;
  await act(async()=>{await api('tozala',{});toast('Tarix tozalandi');await hisobot();await yangila()})}
async function sozlamaOl(){
  const j=await api('sozlama');
  $('#s-servis').value=j.sozlama.servis;$('#s-km').value=j.sozlama.oraliq_km;$('#s-kun').value=j.sozlama.oraliq_kun;
  $('#s-ustalar').innerHTML=j.ustalar.length?j.ustalar.map(u=>`<div class="tr"><span>${esc(u)}</span></div>`).join(''):'<div class="empty">Usta hali qo\'shilmagan.</div>'}
$('#kir').onclick=()=>act(async()=>{await api('login',{login:$('#lg').value,parol:$('#parol').value});$('#parol').value='';await yangila()});
$('#parol').onkeydown=e=>{if(e.key=='Enter')$('#kir').click()};
$('#chiq').onclick=()=>act(async()=>{await api('chiqish',{});show(false)});
$('#f-raqam').onchange=()=>act(async()=>{try{const j=await api('mijoz/'+encodeURIComponent($('#f-raqam').value));
  if(!$('#f-rusum').value)$('#f-rusum').value=j.mijoz.rusum;if(!$('#f-ism').value)$('#f-ism').value=j.mijoz.ism;if(!$('#f-tel').value)$('#f-tel').value=j.mijoz.telefon}catch(e){}});
$('#f-saqla').onclick=()=>act(async()=>{
  const j=await api('xizmat',{raqam:$('#f-raqam').value,rusum:$('#f-rusum').value,ism:$('#f-ism').value,telefon:$('#f-tel').value,km:+$('#f-km').value,moy:$('#f-moy').value,filtr:$('#f-filtr').checked,summa:+$('#f-sum').value});
  ['#f-raqam','#f-rusum','#f-ism','#f-tel','#f-km','#f-sum','#f-moy'].forEach(s=>$(s).value='');$('#f-filtr').checked=false;
  toast('Saqlandi. Keyingi almashtirish: '+j.keyingi_km+' km yoki '+j.keyingi_sana);await yangila()});
$('#q').oninput=()=>act(qidir);
$('#mj-list').onclick=e=>act(async()=>{
  const m=e.target.closest('.mj');if(!m)return;const h=m.querySelector('.hist');if(h.innerHTML){h.innerHTML='';return}
  const j=await api('mijoz/'+m.dataset.r);
  h.innerHTML=`<small>Telefon: ${esc(j.mijoz.telefon)||'yozilmagan'}</small>`+j.tarix.map(x=>`<div class="tr"><span>${x.sana.slice(0,10)}, ${x.km} km, ${esc(x.moy)}${x.filtr?', filtr':''}${x.tovarlar?'<br><small>'+esc(x.tovarlar)+'</small>':''}</span><b class="oil">${pul(x.summa)}</b></div>`).join('')});
$('#s-saqla').onclick=()=>act(async()=>{await api('sozlama',{servis:$('#s-servis').value,oraliq_km:+$('#s-km').value,oraliq_kun:+$('#s-kun').value});toast('Saqlandi');await yangila()});
$('#u-qosh').onclick=()=>act(async()=>{await api('usta',{login:$('#u-login').value,parol:$('#u-parol').value});$('#u-login').value='';$('#u-parol').value='';toast('Usta qo\'shildi');await sozlamaOl()});
$('#sms-hammaga').onclick=()=>act(async()=>{
  const j=await api('sms/yubor',{});
  toast(j.soni?`${j.yuborildi}/${j.soni} ta mijozga SMS yuborildi`:'Eslatma kerak bo\'lgan mijoz yo\'q');
  await yangila()});
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');const t=b&&b.dataset.t;if(!t)return;
  document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#s-'+t).classList.add('on');
  act(async()=>{if(t=='mj')await qidir();if(t=='hs')await hisobot();if(t=='sz')await sozlamaOl();if(t=='esl')await yangila()})};
act(yangila).then(()=>{if($('#app').hidden)show(false)});setInterval(()=>{if(!$('#app').hidden)act(yangila)},60000);
   </script><script src="/ombor.js"></script></body></html>
