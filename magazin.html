<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b45"><title>Mahalla Market</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18231d;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}header{background:#176b45;color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:2}header h1{font-size:1.2rem;margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#176b45;color:white;font-weight:700;cursor:pointer}button.secondary{background:#e8f1eb;color:#176b45}main{max-width:1100px;margin:auto;padding:20px 16px}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input,.tools select,.form input,.form textarea,.form select{min-width:0;width:100%;padding:12px;border:1px solid #d5dfd8;border-radius:10px;background:white}.tools select{max-width:230px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:white;border:1px solid #e4eae5;border-radius:14px;overflow:hidden}.pic{height:150px;width:100%;object-fit:cover;background:#edf2ee}.no-pic{height:150px;display:grid;place-items:center;background:#edf2ee;color:#7a8a7e;font-size:2rem}.body{padding:13px}.body h3{margin:0 0 6px;font-size:1rem}.muted{color:#66736a;font-size:.9rem}.price{font-size:1.15rem;font-weight:800;color:#176b45;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.cart{position:fixed;inset:0;background:#0008;z-index:4;display:none;align-items:flex-end;justify-content:center}.cart.open{display:flex}.panel{background:#fff;width:min(100%,600px);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}.panel h2{margin-top:0}.cartline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf0ed}.form{display:grid;gap:10px;margin-top:16px}.form label{font-weight:650;font-size:.92rem}.form input,.form textarea,.form select{display:block;margin-top:5px}.form textarea{min-height:75px}.notice{padding:12px;border-radius:10px;background:#e8f1eb;margin:12px 0}.hide{display:none!important}.admin{margin-left:8px;color:white;text-decoration:none;font-size:.9rem}@media(max-width:600px){.tools{flex-direction:column}.tools select{max-width:none}main{padding:14px 12px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pic,.no-pic{height:120px}.body{padding:10px}.body button{padding:9px 10px}}
</style>
</head>
<body>
<header><h1>🛒 Mahalla Market</h1><div><a class="admin" href="/magazin/admin">Admin</a> <button id="openCart" class="secondary">Savat <span id="count">0</span></button></div></header>
<main><div class="tools"><input id="search" placeholder="Mahsulot qidirish…"><select id="category"><option value="">Barcha kategoriyalar</option></select></div><div id="products" class="products"></div><p id="empty" class="muted hide">Hozircha mahsulot topilmadi.</p></main>
<div id="cart" class="cart"><div class="panel"><div class="row"><h2>Savatingiz</h2><button id="closeCart" class="secondary">Yopish</button></div><div id="cartItems"></div><p class="row"><b>Jami:</b><b id="total">0 so'm</b></p><form id="orderForm" class="form"><label>Ismingiz<input name="customer_name" required minlength="2" autocomplete="name"></label><label>Telefon raqamingiz<input name="phone" required type="tel" autocomplete="tel" placeholder="+998 90 123 45 67"></label><label>Buyurtmani olish usuli<select name="fulfillment" id="fulfillment"><option value="delivery">Dastavka</option><option value="pickup">Do'kondan olib ketaman</option></select></label><label id="addressLabel">Yetkazib berish manzili<input name="address" id="address" placeholder="Manzil, mo'ljal"></label><label>Izoh (ixtiyoriy)<textarea name="comment" placeholder="Buyurtma bo'yicha izoh"></textarea></label><button type="submit">Buyurtma berish</button></form><div id="message" class="notice hide"></div></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>Number(n).toLocaleString('ru-RU')+" so'm", esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[],cart=new Map();
async function load(){const params=new URLSearchParams({q:$('#search').value,category:$('#category').value});const r=await fetch('/api/shop/products?'+params);products=await r.json();const cats=[...new Set(products.map(p=>p.category))];const old=$('#category').value;$('#category').innerHTML='<option value="">Barcha kategoriyalar</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('#category').value=cats.includes(old)?old:'';$('#products').innerHTML=products.map(p=>`<article class="card">${p.image_url?`<img class="pic" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="no-pic">🛍️</div>'}<div class="body"><small class="muted">${esc(p.category)}</small><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description)}</div><div class="price">${money(p.price)}</div><div class="row"><small class="muted">Qoldi: ${p.stock}</small><button data-add="${p.id}">Savatga</button></div></div></article>`).join('');$('#empty').classList.toggle('hide',products.length>0)}
function drawCart(){let lines=[...cart].map(([id,qty])=>{let p=products.find(x=>x.id===id);return p?`<div class="cartline"><span>${esc(p.name)}<br><small>${money(p.price)} × ${qty}</small></span><span><button class="secondary" data-dec="${id}">−</button> ${qty} <button class="secondary" data-inc="${id}">+</button></span></div>`:''}).join('');$('#cartItems').innerHTML=lines||'<p class="muted">Savatingiz hozircha bo‘sh.</p>';let total=[...cart].reduce((s,[id,q])=>s+(products.find(p=>p.id===id)?.price||0)*q,0);$('#total').textContent=money(total);$('#count').textContent=[...cart.values()].reduce((a,b)=>a+b,0)}
$('#products').onclick=e=>{let id=Number(e.target.dataset.add);if(!id)return;let p=products.find(x=>x.id===id);cart.set(id,Math.min(p.stock,(cart.get(id)||0)+1));drawCart()};$('#cartItems').onclick=e=>{let id=Number(e.target.dataset.inc||e.target.dataset.dec);if(!id)return;let n=(cart.get(id)||0)+(e.target.dataset.inc?1:-1);if(n<=0)cart.delete(id);else cart.set(id,n);drawCart()};$('#openCart').onclick=()=>$('#cart').classList.add('open');$('#closeCart').onclick=()=>$('#cart').classList.remove('open');$('#cart').onclick=e=>{if(e.target.id==='cart')$('#cart').classList.remove('open')};$('#fulfillment').onchange=()=>{let delivery=$('#fulfillment').value==='delivery';$('#addressLabel').classList.toggle('hide',!delivery);$('#address').required=delivery};$('#search').oninput=load;$('#category').onchange=load;
$('#orderForm').onsubmit=async e=>{e.preventDefault();if(!cart.size){alert('Avval savatga mahsulot qo‘shing');return}let data=Object.fromEntries(new FormData(e.target));data.items=[...cart].map(([product_id,quantity])=>({product_id,quantity}));let button=e.target.querySelector('button[type=submit]');button.disabled=true;try{let r=await fetch('/api/shop/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.detail||'Buyurtma yuborilmadi');cart.clear();drawCart();e.target.reset();$('#fulfillment').onchange();$('#message').textContent=`Buyurtma №${j.order_id} qabul qilindi. Jami: ${money(j.total)}. Do‘kon siz bilan bog‘lanadi.`;$('#message').classList.remove('hide');await load()}catch(err){alert(err.message)}finally{button.disabled=false}};
load();drawCart();
</script>
</body></html>
